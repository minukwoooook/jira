[project]
name = "jira-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["oracledb>=2.0", "httpx>=0.27", "pydantic-settings>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["jira_dashboard*"]
